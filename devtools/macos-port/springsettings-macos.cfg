# springsettings.cfg for the macOS core-profile port.
#
# Copy to <write-dir>/springsettings.cfg. Only the GL block is mandatory; the
# rest is what makes BAR usable on a Mac. The engine rewrites this file on exit
# (sorting keys and keeping these comments), so edit it only while nothing is
# running, or your changes are silently lost.

# --- mandatory -------------------------------------------------------------
# Apple's driver gives a 4.1 core profile and nothing newer. Without these the
# engine tries 4.4/4.5/4.6, every attempt fails, and it aborts having created
# no context at all.
ForceCoreContext = 1
GLContextMajorVersion = 4
GLContextMinorVersion = 1

# BAR's GL4 render path needs SSBOs (GL 4.3). On 4.1 it has to fall back to the
# older path, or most of the interface draws nothing.
ForceDisableGL4 = 1

# Loads the override archive built by deploy-bar-overrides.py. Mutators load
# before the game archive and with overwrite set, so these files win - which is
# how the overrides reach a game launched from the Chobby menu, where the
# gametype is BAR's own. Single-player only: it changes the set of loaded
# archives, and multiplayer clients all have to agree on that.
ExtraMutators = BAR macOS overrides 1

# Absolute paths, colon-separated: <build-dir>:<repo>/cont. The second entry is
# what supplies the base content (bitmaps.sdz and friends).
SpringData = /path/to/RecoilEngine/build-all:/path/to/RecoilEngine/cont

# --- the menu --------------------------------------------------------------
# The Chobby archive name exactly as the download reported it. Launch with no
# start script to get the menu. Comment this out to go straight to a skirmish.
DefaultLuaMenu = BYAR Chobby test-4668-2e85fd3

# --- camera ----------------------------------------------------------------
# 3 is the Spring camera. Use it: in RotOverhead (the mode some content saves)
# rotation comes only from dragging the middle mouse button, which an Apple
# trackpad does not have, so the camera cannot be rotated at all. In the Spring
# camera, Option + arrow keys rotates.
CamMode = 3

# Defaults to 1, which slides the camera toward the cursor as you scroll and
# reads as "panning instead of zooming".
CamSpringZoomInToMousePos = 0

# --- display ---------------------------------------------------------------
# macOS will not composite a window on a sleeping display: the buffer swap
# blocks forever, the engine never leaves the splash screen, and the watchdog
# logs a hang every 30s. Nothing here avoids that - keep the screen awake.
Fullscreen = 0
Vsync = 0
WindowBorderless = 1

# Startup aborts with "Failed to load FontFile" if <build>/fonts is missing;
# copy cont/fonts there.
FontFile = FreeSansBold.otf
SmallFontFile = FreeSansBold.otf

# A stale archive cache hangs VFS init; this keeps it from being written.
VFSCacheArchiveFiles = 0
